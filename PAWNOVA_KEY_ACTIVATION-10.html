<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>PAWNOVA · Kích hoạt</title><style>
:root{color-scheme:dark;--bg:#080b14;--line:#26344b;--text:#edf4ff;--muted:#91a2bc;--cyan:#63e6ff;--violet:#a58bff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(55rem 40rem at 0 0,#1a3151,transparent 50%),radial-gradient(45rem 35rem at 100% 10%,#2a1a4d,transparent 50%),var(--bg);color:var(--text);font:14px/1.55 system-ui,sans-serif}.card{width:min(470px,100%);padding:28px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#121d2df2,#0b1220f5);box-shadow:0 30px 100px #0008;animation:rise .45s ease}.logo{width:54px;height:54px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101d;font-size:27px;font-weight:1000}.eyebrow{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.18em;margin-top:22px}h1{font-size:23px;margin:16px 0 4px}.muted{color:var(--muted)}.field{display:grid;gap:8px;margin:18px 0}.field label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.1em}.input{width:100%;padding:14px;background:#080f1b;border:1px solid #2a3b54;border-radius:13px;color:var(--text);font:inherit;outline:none}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #63e6ff18}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(120deg,var(--cyan),var(--violet));color:#07111d;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.status{display:none;margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:12px;overflow-wrap:anywhere}.status.show{display:block}.ok{background:#102c28;border-color:#236850}.err{background:#321723;border-color:#733143}.detail{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #202e42}.detail span{color:var(--muted)}.footer{text-align:center;font-size:10px;color:#63748e;letter-spacing:.12em;margin-top:22px}.api{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:10px}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="card"><div class="logo">P</div><div class="eyebrow">PAWNOVA ACCESS GATE</div><h1>Kích hoạt giấy phép</h1><div class="muted">Nhập key được cấp để liên kết giấy phép với thiết bị này. Trạng thái và thời hạn được xác nhận bởi máy chủ.</div><form id="form"><div class="field"><label>LICENSE KEY</label><input id="key" class="input" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Nhập key PAWNOVA" required minlength="4"></div><button id="submit" class="btn">XÁC THỰC & KÍCH HOẠT ↗</button></form><div id="status" class="status" role="status" aria-live="polite"></div><div id="details"></div><div id="apiLabel" class="api"></div><div class="footer">SERVER-VALIDATED · DEVICE-BOUND LICENSE</div></main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),API=(params.get('api')||'').trim().replace(/\/+$/,'');function deviceId(){const k='pawnova_device_id';try{let v=localStorage.getItem(k);if(!v){v=crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem(k,v)}return v}catch{return 'session-'+Math.random().toString(36).slice(2)+Date.now().toString(36)}}const device=deviceId();$('apiLabel').textContent='Gateway: '+(API||'cùng domain hiện tại')+' · Device ID được lưu trên trình duyệt.';function show(text,type,d){const s=$('status');s.textContent=text;s.className='status show '+type;$('details').replaceChildren();if(d)for(const [k,v] of [['Thời hạn',d.duration_days?d.duration_days+' ngày':'—'],['Kích hoạt lúc',d.activated_at||'—'],['Hết hạn lúc',d.expires_at||'—']]){const r=document.createElement('div');r.className='detail';const a=document.createElement('span'),b=document.createElement('b');a.textContent=k;b.textContent=v;r.append(a,b);$('details').append(r)}}$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;b.textContent='ĐANG XÁC THỰC…';try{const r=await fetch((API||'')+'/api/activate',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},cache:'no-store',body:JSON.stringify({key:$('key').value.trim(),device_id:device})});let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false)throw Error(d.error||d.message||'HTTP '+r.status);show('Kích hoạt thành công. Máy chủ đã xác nhận key và thiết bị.','ok',d);b.textContent='ĐÃ KÍCH HOẠT ✓'}catch(err){show('Kích hoạt thất bại: '+err.message+'. Kiểm tra key, gateway API và trạng thái giấy phép.','err');b.textContent='THỬ LẠI ↗'}finally{b.disabled=false}};
</script></body></html>
